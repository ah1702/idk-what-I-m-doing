<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alyssa's Mental Hospital</title>
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
    <style>
        body {
            text-align: center; 
            margin: 0;
            font-family: 'Indie Flower', cursive; 
            background-color: #F0F8FF; /* Light blue background */
            color: #333; /* Darker text color for readability */
            padding: 20px;
        }
        .banner {
            background-color: #FFB6C1; /* Light pink */
            color: #301934; /* Darker text color for the banner */
            padding: 30px; 
            font-size: 28px; 
            border-radius: 15px; /* Rounded corners */
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3); /* Deeper shadow */
            margin-bottom: 20px; /* Space below the banner */
        }
        h1 {
            margin: 20px 0; 
            font-size: 48px; /* Larger font size */
            color: #FF69B4; /* Hot pink color */
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3); /* Text shadow for depth */
        }
        p {
            font-size: 20px; 
            line-height: 1.6; 
            margin: 15px 0; 
            transition: transform 0.3s; /* Scale effect on hover */
        }
        p:hover {
            transform: scale(1.05); /* Slightly larger on hover */
            color: #FF69B4; /* Change color on hover */
        }
        footer {
            margin-top: 40px; 
            font-style: italic; 
            color: #555; 
            padding: 10px; /* Padding for footer */
            border-top: 2px solid #FFB6C1; /* Top border for footer */
        }
        footer:hover {
            color: #301934; 
            cursor: pointer; 
        }
    </style>
</head>
<body>
    <div class="banner">Welcome to Alyssa's Mental Hospital!</div>
    <h1>Hiii, Welcome!</h1>
    <p>This is my first website.</p>
    <p>I'm so excited!!!</p>
    <p>This is so awesome sauce.</p>
    <footer>ChatGPT helped me with this! :D</footer>
</body>
</html>
