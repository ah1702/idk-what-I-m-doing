<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alyssa's Mental Hospital</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            text-align: center; 
            margin: 0;
            font-family: 'Roboto', sans-serif; 
            background-color: #E6E6FA; /* Light background color */
            color: #333; /* Darker text color for better readability */
            padding: 20px;
        }
        .banner {
            background-color: #F8EDDD; 
            color: #301934; /* Darker text color for the banner */
            padding: 20px; 
            font-size: 28px; /* Increased font size */
            border-bottom: 4px solid #F7DDDC; /* Pink bottom border */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); /* Deeper shadow */
            transition: background-color 0.3s; /* Smooth background transition */
        }
        .banner:hover {
            background-color: #F0D2B5; /* Slightly darker on hover */
        }
        h1 {
            margin: 20px 0; /* Add space above and below the h1 */
            font-size: 42px; /* Increase font size */
            color: #FF6F61; /* Soft coral color */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2); /* Text shadow for depth */
        }
        p {
            font-size: 20px; /* Slightly larger font size for paragraphs */
            line-height: 1.6; /* Improve readability with line spacing */
            margin: 15px 0; /* Space between paragraphs */
            transition: color 0.3s; /* Smooth color transition */
        }
        p:hover {
            color: #FF6F61; /* Change color on hover */
        }
        footer {
            margin-top: 40px; 
            font-style: italic; /* Italicize footer text */
            color: #555; /* Lighter gray for footer text */
            transition: color 0.3s; /* Smooth color transition */
        }
        footer:hover {
            color: #301934; /* Change color on hover */
            cursor: pointer; /* Change cursor to pointer */
        }
    </style>
</head>
<body>
    <div class="banner">Welcome to Alyssa's Mental Hospital!</div>
    <h1>hiiiii</h1>
    <p>This is my first website.</p>
    <p>I'm so excited!!!</p>
    <p>This is so awesome sauce.</p>
    <footer>ChatGPT taught me how to do this :P</footer>
</body>
</html>
