<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alyssa's Mental Hospital</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
    <style>
        body {
            text-align: center; 
            margin: 0;
            font-family: 'Dancing Script', cursive; 
            background-color: #FAF3E0; /* Soft beige background */
            color: #4A4A4A; /* Dark gray text for readability */
            padding: 20px;
        }
        .banner {
            background-color: #FFD8D1; /* Soft peach color */
            color: #6D4B8A; /* Deep lavender text color */
            padding: 30px; 
            font-size: 28px; 
            border-radius: 15px; /* Rounded corners */
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2); /* Subtle shadow */
            margin-bottom: 20px; /* Space below the banner */
        }
        h1 {
            margin: 20px 0; 
            font-size: 48px; /* Larger font size */
            color: #9B6B8C; /* Muted purple color */
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1); /* Soft text shadow */
        }
        p {
            font-size: 20px; 
            line-height: 1.6; 
            margin: 15px 0; 
            transition: transform 0.3s; /* Scale effect on hover */
        }
        p:hover {
            transform: scale(1.05); /* Slightly larger on hover */
            color: #9B6B8C; /* Change color on hover */
        }
        footer {
            margin-top: 40px; 
            font-style: italic; 
            color: #4A4A4A; 
            padding: 10px; /* Padding for footer */
            border-top: 2px solid #FFD8D1; /* Top border for footer */
        }
        footer:hover {
            color: #6D4B8A; 
            cursor: pointer; 
        }
    </style>
</head>
<body>
    <div class="banner">Welcome to Alyssa's Cottage!</div>
    <h1>Hiii, Welcome!</h1>
    <p>This is my cozy corner of the internet.</p>
    <p>I'm so excited to share this with you!</p>
    <p>Nature and creativity are my inspirations.</p>
    <footer>ChatGPT helped me create this cozy space! :)</footer>
</body>
</html>
